name: CI

on:
  push:
    branches: [main, feat/mvp-vertical-slice]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start preview server
        run: |
          npm run dev -- --host 127.0.0.1 --port 4173 > /tmp/focus-raid-vite.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173 >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/focus-raid-vite.log
          exit 1
      - name: Capture UI states
        run: npm run visual:capture
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focus-raid-visual-qa
          path: artifacts/visual/*.png
          if-no-files-found: error
          retention-days: 14
