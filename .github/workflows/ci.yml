name: Android CI

on:
  push:
    branches: [main, feat/android-native-mvp]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Unit tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Lint
        run: gradle lintDebug --stacktrace

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: focus-raid-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture READY / RAID / VICTORY
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            gradle installDebug --stacktrace
            mkdir -p artifacts/visual
            adb shell settings put system font_scale 1.0

            capture() {
              phase="$1"
              width="$2"
              height="$3"
              output="$4"
              adb shell am force-stop com.madowaku.focusraid
              adb shell wm size "${width}x${height}"
              adb shell wm density 160
              adb shell am start -W -n com.madowaku.focusraid/.VisualQaActivity --es phase "$phase"
              sleep 2
              adb exec-out screencap -p > "artifacts/visual/${output}.png"
            }

            capture READY 360 800 ready-360x800
            capture RAID 360 800 raid-360x800
            capture VICTORY 360 800 victory-360x800
            capture READY 720 1280 ready-720x1280
            capture RAID 720 1280 raid-720x1280
            capture VICTORY 720 1280 victory-720x1280

            adb shell wm size reset
            adb shell wm density reset

      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: focus-raid-visual-qa
          path: artifacts/visual/*.png
          if-no-files-found: error
          retention-days: 14
