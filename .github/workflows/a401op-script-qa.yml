name: A401OP script QA

on:
  pull_request:
    paths:
      - 'scripts/device-check-a401op.ps1'
      - 'scripts/test-device-check-a401op.ps1'
      - '.github/workflows/a401op-script-qa.yml'

jobs:
  device-script-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate A401OP script without a connected device
        shell: pwsh
        run: ./scripts/test-device-check-a401op.ps1
